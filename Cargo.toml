[package]
name = "drift"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native macOS player for YouTube Music, where every song becomes a galaxy."
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/bazodev/drift"
publish = false
default-run = "drift"

[dependencies]
futures = "0.3"
# runtime_shaders: no separate Xcode Metal Toolchain needed to build.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rtrb = "0.4"
rustfft = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3"
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
wry = "0.57.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSImage", "NSResponder", "NSWindow"] }
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKPreferences", "WKWebView", "WKWebViewConfiguration"] }

[profile.dev.package."*"]
opt-level = 2
